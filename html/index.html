<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Gateway - Authentication</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        .login-container h2 {
            margin: 0 0 10px 0;
            color: #343a40;
            font-size: 24px;
            text-align: center;
        }
        .login-container p {
            color: #6c757d;
            margin: 0 0 30px 0;
            font-size: 14px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.15s ease-in-out;
        }
        .input-group input:focus {
            outline: none;
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        .login-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-btn:hover {
            background-color: #004494;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 20px;
            padding: 10px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
        .show-error {
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Enterprise Gateway</h2>
        <p>Restricted Internal Access</p>
        
        <form method="POST" action="/auth">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="login-btn">Authenticate</button>
        </form>
        
        <div class="error-msg" id="errorMsg">
            Authentication failed. Invalid credentials provided. Incident has been logged.
        </div>
    </div>

    <script>
        if (window.location.search.includes('error=')) {
            document.getElementById('errorMsg').classList.add('show-error');
        }
    </script>

</body>
</html>
